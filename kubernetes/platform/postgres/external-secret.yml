apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgres-admin
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: platform/postgres
        property: POSTGRES_PASSWORD
