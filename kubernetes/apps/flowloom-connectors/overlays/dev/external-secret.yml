# The connector's own secrets from OpenBao apps/flowloom-connectors-dev
# (scripts/flowloom-connectors-bootstrap-k3s.sh): its platform worker key for
# the dev engine and its AppRole flowloom-connectors-dev (reads connections,
# and issues/rotates the Microsoft app secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flowloom-connectors
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flowloom-connectors
    creationPolicy: Owner
  data:
    - secretKey: FLOWLOOM_API_KEY
      remoteRef:
        key: flowloom-connectors-dev
        property: FLOWLOOM_API_KEY
    - secretKey: OPENBAO_ROLE_ID
      remoteRef:
        key: flowloom-connectors-dev
        property: OPENBAO_ROLE_ID
    - secretKey: OPENBAO_SECRET_ID
      remoteRef:
        key: flowloom-connectors-dev
        property: OPENBAO_SECRET_ID
