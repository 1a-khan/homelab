# This engine's secrets from OpenBao apps/flowloom-prod
# (scripts/flowloom-k3s-bootstrap-openbao.sh and the AppRole/Keycloak scripts).
# Only what the engine itself needs: never the workers' read role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flowloom
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flowloom
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: flowloom-prod
        property: DATABASE_URL
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: flowloom-prod
        property: SECRET_KEY_BASE
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: flowloom-prod
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: KEYCLOAK_ADMIN_CLIENT_SECRET
      remoteRef:
        key: flowloom-prod
        property: KEYCLOAK_ADMIN_CLIENT_SECRET
    - secretKey: OPENBAO_ADMIN_ROLE_NAME
      remoteRef:
        key: flowloom-prod
        property: OPENBAO_ADMIN_ROLE_NAME
    - secretKey: OPENBAO_ADMIN_ROLE_ID
      remoteRef:
        key: flowloom-prod
        property: OPENBAO_ADMIN_ROLE_ID
    - secretKey: OPENBAO_ADMIN_SECRET_ID
      remoteRef:
        key: flowloom-prod
        property: OPENBAO_ADMIN_SECRET_ID
