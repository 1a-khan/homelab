installCRDs: true
leaderElect: false
replicaCount: 1
fullnameOverride: external-secrets

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  renderMode: skipIfMissing
  additionalLabels:
    release: kube-prometheus-stack
  interval: 30s
  scrapeTimeout: 10s

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

