# Generated by scripts/keycloak-bootstrap-openbao.sh into OpenBao apps/keycloak.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak
  namespace: keycloak
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak
    creationPolicy: Owner
  data:
    - secretKey: KC_DB_USERNAME
      remoteRef:
        key: keycloak
        property: KC_DB_USERNAME
    - secretKey: KC_DB_PASSWORD
      remoteRef:
        key: keycloak
        property: KC_DB_PASSWORD
