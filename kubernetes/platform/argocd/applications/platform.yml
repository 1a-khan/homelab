apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.31.0
    helm:
      values: |
        operator:
          builtInTrivyServer: false
          scanJobsConcurrentLimit: 1
          scanJobTimeout: 10m
        trivy:
          ignoreUnfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          resources:
            requests:
              cpu: 50m
              memory: 100M
            limits:
              cpu: 250m
              memory: 500M
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: homelab
