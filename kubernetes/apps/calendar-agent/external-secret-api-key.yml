apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-agent-api-key
  namespace: calendar-agent
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: calendar-agent-api-key
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: calendar-agent/api
        property: API_KEY
