apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwarded-https
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowloom
  annotations:
    # <namespace>-<middleware>@kubernetescrd; each overlay sets its namespace.
    traefik.ingress.kubernetes.io/router.middlewares: NAMESPACE-forwarded-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowloom
                port:
                  number: 4000
