namespace: flowloom-dev

resources:
  - namespace.yml
  - external-secret.yml
  - ../../base

configMapGenerator:
  - name: flowloom-environment
    literals:
      - FLOWLOOM_ENVIRONMENT=dev
      - PHX_HOST=dev-flowloom.miak-it.com

# The engine version this environment runs (a commit of 1a-khan/flowloom
# that CI built and scanned). Upgrade: change it and push.
images:
  - name: ghcr.io/1a-khan/flowloom
    newTag: 15d13148bcf1476299cc70de7ee61185e822db67

replicas:
  - name: flowloom
    count: 1

patches:
  - target:
      kind: Ingress
      name: flowloom
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev-flowloom.miak-it.com
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: flowloom-dev-forwarded-https@kubernetescrd
