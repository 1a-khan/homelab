apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kids-prep-data
  namespace: kids-prep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kids-prep
  namespace: kids-prep
  annotations:
    secret.reloader.stakater.com/reload: "kids-prep"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kids-prep
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kids-prep
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: kids-prep
          image: ghcr.io/1a-khan/kids-prep:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: kids-prep
          env:
            - name: DATABASE_PATH
              value: /app/data/kids_prep_prod.db
            - name: ELIXIR_ERL_OPTIONS
              value: +fnu
            - name: HOST
              value: 0.0.0.0
            - name: MIX_ENV
              value: prod
            - name: OPENBAO_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
            - name: OPENBAO_APPROLE_AUTH_PATH
              value: approle
            - name: OPENBAO_APP_SECRET_PATH
              value: coolify/kids-prep
            - name: OPENBAO_KV_MOUNT
              value: secret
            - name: PHX_HOST
              value: kids-prep.miak-it.com
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: "4000"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kids-prep-data
---
apiVersion: v1
kind: Service
metadata:
  name: kids-prep
  namespace: kids-prep
spec:
  selector:
    app.kubernetes.io/name: kids-prep
  ports:
    - name: http
      port: 4000
      targetPort: http
