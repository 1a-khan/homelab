apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calendar-agent
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: git@github.com:1a-khan/homelab.git
    targetRevision: main
    path: kubernetes/apps/calendar-agent
    directory:
      include: '{namespace.yml,external-secret-api-key.yml,calendar-agent-api.yml,ingress.yml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: calendar-agent
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
