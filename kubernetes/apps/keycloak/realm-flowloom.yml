# Realm as code: imported by Keycloak on first start (--import-realm) and
# skipped once the realm exists. The key must be named <realm>-realm.json. No users or secrets here: the client secret
# is generated by scripts/keycloak-bootstrap-flowloom.sh, users are created
# there or in the admin console.
#
# Organization memberships reach the ID token through Keycloak's built-in
# "organization" client scope: Flowloom requests scope="openid ... organization"
# and gets claim organization: ["<org alias>", ...] (alias = tenant slug).
#
# Admin rights and department roles come from groups (claim flowloom_groups):
# /flowloom-platform-admins, /tenants/<tenant>/admins and
# /tenants/<tenant>/departments/<dept>/<viewer|operator|developer>, managed
# from Flowloom Studio through the flowloom-admin-api service account (users,
# groups and organizations only). The client roles below are no longer used.
# Existing realms: scripts/keycloak-flowloom-admin-setup.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-flowloom
  namespace: keycloak
data:
  flowloom-realm.json: |
    {
      "realm": "flowloom",
      "displayName": "Flowloom",
      "enabled": true,
      "organizationsEnabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": false,
      "verifyEmail": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "failureFactor": 5,
      "waitIncrementSeconds": 60,
      "maxFailureWaitSeconds": 900,
      "maxDeltaTimeSeconds": 43200,
      "passwordPolicy": "length(12) and notUsername and notEmail and passwordHistory(3)",
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "otpPolicyType": "totp",
      "clients": [
        {
          "clientId": "flowloom-studio",
          "name": "Flowloom Studio",
          "description": "Browser login for Flowloom Studio (all environments).",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "frontchannelLogout": false,
          "redirectUris": [
            "https://dev-flowloom.miak-it.com/auth/callback",
            "https://staging-flowloom.miak-it.com/auth/callback",
            "https://flowloom.miak-it.com/auth/callback",
            "http://localhost:4010/auth/callback"
          ],
          "webOrigins": [
            "+"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://dev-flowloom.miak-it.com/*##https://staging-flowloom.miak-it.com/*##https://flowloom.miak-it.com/*##http://localhost:4010/*",
            "backchannel.logout.session.required": "true"
          },
          "protocolMappers": [
            {
              "name": "flowloom roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-client-role-mapper",
              "consentRequired": false,
              "config": {
                "usermodel.clientRoleMapping.clientId": "flowloom-studio",
                "claim.name": "flowloom_roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "flowloom groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "flowloom_groups",
                "full.path": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "flowloom-admin-api",
          "name": "Flowloom admin API",
          "description": "Flowloom admin screens: users, groups, organizations only",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false
        }
      ],
      "roles": {
        "client": {
          "flowloom-studio": [
            {
              "name": "viewer",
              "description": "Read-only: processes, instances, event logs.",
              "composite": false
            },
            {
              "name": "operator",
              "description": "Viewer + instance operations (stop/retry/delete), connection values, webhook credentials.",
              "composite": true,
              "composites": {
                "client": {
                  "flowloom-studio": [
                    "viewer"
                  ]
                }
              }
            },
            {
              "name": "developer",
              "description": "Operator + model, save and deploy processes; task templates.",
              "composite": true,
              "composites": {
                "client": {
                  "flowloom-studio": [
                    "operator"
                  ]
                }
              }
            },
            {
              "name": "tenant-admin",
              "description": "Developer + API keys and creating/deleting connections.",
              "composite": true,
              "composites": {
                "client": {
                  "flowloom-studio": [
                    "developer"
                  ]
                }
              }
            }
          ]
        }
      },
      "groups": [
        {
          "name": "flowloom-platform-admins"
        },
        {
          "name": "tenants"
        }
      ],
      "users": [
        {
          "username": "service-account-flowloom-admin-api",
          "enabled": true,
          "serviceAccountClientId": "flowloom-admin-api",
          "clientRoles": {
            "realm-management": [
              "manage-users",
              "view-users",
              "query-users",
              "query-groups",
              "manage-organizations",
              "view-organizations",
              "query-organizations"
            ]
          }
        }
      ]
    }
