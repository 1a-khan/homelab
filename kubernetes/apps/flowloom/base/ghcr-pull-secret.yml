# Pulls the private image ghcr.io/1a-khan/flowloom with a read:packages
# token from OpenBao apps/ghcr (scripts/flowloom-k3s-bootstrap-openbao.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: ghcr
        property: GHCR_USERNAME
    - secretKey: token
      remoteRef:
        key: ghcr
        property: GHCR_TOKEN
