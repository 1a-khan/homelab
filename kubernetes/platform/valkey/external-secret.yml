apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey
  namespace: valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: valkey
    creationPolicy: Owner
  data:
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: platform/valkey
        property: VALKEY_PASSWORD
