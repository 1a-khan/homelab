apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-exporter
  namespace: costs
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer

    METRICS = """# HELP homelab_power_watts Estimated mini PC power usage in watts.
    # TYPE homelab_power_watts gauge
    homelab_power_watts{device="mini_pc"} 25
    # HELP homelab_electricity_price_eur_per_kwh Electricity price in EUR per kWh.
    # TYPE homelab_electricity_price_eur_per_kwh gauge
    homelab_electricity_price_eur_per_kwh 0.35
    # HELP homelab_hardware_purchase_cost_eur Hardware purchase price in EUR.
    # TYPE homelab_hardware_purchase_cost_eur gauge
    homelab_hardware_purchase_cost_eur{device="mini_pc"} 150
    # HELP homelab_hardware_amortization_months Hardware amortization period in months.
    # TYPE homelab_hardware_amortization_months gauge
    homelab_hardware_amortization_months{device="mini_pc"} 36
    # HELP homelab_hardware_purchase_timestamp_seconds Hardware purchase timestamp.
    # TYPE homelab_hardware_purchase_timestamp_seconds gauge
    homelab_hardware_purchase_timestamp_seconds{device="mini_pc"} 1786665600
    # HELP homelab_vps_cost_eur_per_month Current VPS monthly cost in EUR.
    # TYPE homelab_vps_cost_eur_per_month gauge
    homelab_vps_cost_eur_per_month{provider="hetzner",plan="8vcpu_16gb_160gb_20tb_shared"} 17
    # HELP homelab_domain_cost_eur_per_year Domain yearly cost in EUR.
    # TYPE homelab_domain_cost_eur_per_year gauge
    homelab_domain_cost_eur_per_year{domain="miak-it.dev"} 0
    # HELP homelab_backup_cost_eur_per_month Backup storage monthly cost in EUR.
    # TYPE homelab_backup_cost_eur_per_month gauge
    homelab_backup_cost_eur_per_month{provider="onedrive"} 0
    """

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path not in ("/", "/metrics"):
                self.send_response(404)
                self.end_headers()
                return
            body = METRICS.encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            return

    HTTPServer(("0.0.0.0", 9101), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-exporter
  namespace: costs
  labels:
    app.kubernetes.io/name: cost-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cost-exporter
    spec:
      containers:
        - name: cost-exporter
          image: python:3.14.0-alpine3.22
          command:
            - python
            - /app/server.py
          ports:
            - name: metrics
              containerPort: 9101
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: cost-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: cost-exporter
  namespace: costs
  labels:
    app.kubernetes.io/name: cost-exporter
spec:
  selector:
    app.kubernetes.io/name: cost-exporter
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cost-exporter
  namespace: costs
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-exporter
  namespaceSelector:
    matchNames:
      - costs
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
