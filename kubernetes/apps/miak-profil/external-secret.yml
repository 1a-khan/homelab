apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miak-profil
  namespace: miak-profil
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: miak-profil
    creationPolicy: Owner
  data:
    - secretKey: PROFILE_SECRET
      remoteRef:
        key: miak-profil
        property: PROFILE_SECRET
