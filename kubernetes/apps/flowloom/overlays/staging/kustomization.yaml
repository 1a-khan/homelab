namespace: flowloom-staging

resources:
  - namespace.yml
  - external-secret.yml
  - ../../base

configMapGenerator:
  - name: flowloom-environment
    literals:
      - FLOWLOOM_ENVIRONMENT=staging
      - PHX_HOST=staging-flowloom.miak-it.com

# The engine version this environment runs (a commit of 1a-khan/flowloom
# that CI built and scanned). Upgrade: change it and push.
images:
  - name: ghcr.io/1a-khan/flowloom
    newTag: 174e4f68c38dcbef57a0db34568cf1c36436d535

replicas:
  - name: flowloom
    count: 1

patches:
  - target:
      kind: Ingress
      name: flowloom
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging-flowloom.miak-it.com
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: flowloom-staging-forwarded-https@kubernetescrd
