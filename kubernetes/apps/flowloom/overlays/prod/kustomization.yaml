namespace: flowloom-prod

resources:
  - namespace.yml
  - external-secret.yml
  - ../../base

configMapGenerator:
  - name: flowloom-environment
    literals:
      - FLOWLOOM_ENVIRONMENT=prod
      - PHX_HOST=flowloom.miak-it.com
      - FLOWLOOM_CONFIG_FILE=/etc/flowloom/environment.json
  # What this engine has (tenants, connections, keys), declared instead of set
  # up in Studio (flowloom docs/ENVIRONMENT_CONFIG.md). No secrets: values are
  # in OpenBao, keys only as sha256. Raise "revision" with every change.
  # The platform key is written by scripts/flowloom-connectors-bootstrap-k3s.sh.
  - name: flowloom-config
    files:
      - environment.json

# The engine version this environment runs (a commit of 1a-khan/flowloom
# that CI built and scanned). Upgrade: change it and push.
images:
  - name: ghcr.io/1a-khan/flowloom
    newTag: 60f144dd46d34a0c40fe8c9acf120ea644aefba4

# One pod until the engines run as an Erlang cluster (DNS_CLUSTER_QUERY):
# without it, live Studio updates only reach users on the same pod.
# Rolling updates still surge a second pod, so deploys have no downtime.
replicas:
  - name: flowloom
    count: 1

patches:
  - target:
      kind: Ingress
      name: flowloom
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: flowloom.miak-it.com
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: flowloom-prod-forwarded-https@kubernetescrd
  # The environment config file, mounted as a folder (not subPath).
  - target:
      kind: Deployment
      name: flowloom
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: flowloom
      spec:
        template:
          spec:
            volumes:
              - name: config
                configMap:
                  name: flowloom-config
            containers:
              - name: flowloom
                volumeMounts:
                  - name: config
                    mountPath: /etc/flowloom
                    readOnly: true
