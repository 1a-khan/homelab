---
- name: Deploy edge monitoring services
  hosts: hetzner_vps
  become: true

  vars:
    uptime_kuma_dir: /opt/uptime-kuma
    wireguard_interface: wg0
    wireguard_port: 51820
    wireguard_address: 10.44.0.1/24
    wireguard_peer_allowed_ip: 10.44.0.2/32

  handlers:
    - name: Restart wireguard
      ansible.builtin.service:
        name: "wg-quick@{{ wireguard_interface }}"
        state: restarted

  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name:
          - wireguard
        state: present
        update_cache: true

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Create WireGuard config directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check WireGuard private key
      ansible.builtin.stat:
        path: /etc/wireguard/server.key
      register: wireguard_server_key

    - name: Generate WireGuard private key
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > /etc/wireguard/server.key
      changed_when: true
      when: not wireguard_server_key.stat.exists

    - name: Read WireGuard private key
      ansible.builtin.slurp:
        src: /etc/wireguard/server.key
      register: wireguard_private_key
      no_log: true

    - name: Generate WireGuard public key
      ansible.builtin.shell:
        cmd: wg pubkey < /etc/wireguard/server.key
      register: wireguard_public_key
      changed_when: false

    - name: Write WireGuard server config
      ansible.builtin.copy:
        dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address = {{ wireguard_address }}
          ListenPort = {{ wireguard_port }}
          PrivateKey = {{ wireguard_private_key.content | b64decode | trim }}

          {% if wireguard_peer_public_key is defined and wireguard_peer_public_key | length > 0 %}
          [Peer]
          PublicKey = {{ wireguard_peer_public_key }}
          AllowedIPs = {{ wireguard_peer_allowed_ip }}
          {% endif %}
      no_log: true
      notify: Restart wireguard

    - name: Enable WireGuard
      ansible.builtin.service:
        name: "wg-quick@{{ wireguard_interface }}"
        enabled: true
        state: started

    - name: Create Uptime Kuma directory
      ansible.builtin.file:
        path: "{{ uptime_kuma_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write Uptime Kuma compose file
      ansible.builtin.copy:
        dest: "{{ uptime_kuma_dir }}/compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          services:
            uptime-kuma:
              image: louislam/uptime-kuma:2
              container_name: uptime-kuma
              restart: unless-stopped
              ports:
                - "3001:3001"
              volumes:
                - uptime-kuma:/app/data

          volumes:
            uptime-kuma:

    - name: Start Uptime Kuma
      community.docker.docker_compose_v2:
        project_src: "{{ uptime_kuma_dir }}"
        state: present

    - name: Allow Uptime Kuma web UI
      community.general.ufw:
        rule: allow
        port: "3001"
        proto: tcp

    - name: Allow WireGuard
      community.general.ufw:
        rule: allow
        port: "{{ wireguard_port | string }}"
        proto: udp

    - name: Show WireGuard server public key
      ansible.builtin.debug:
        msg: "WireGuard server public key: {{ wireguard_public_key.stdout }}"
