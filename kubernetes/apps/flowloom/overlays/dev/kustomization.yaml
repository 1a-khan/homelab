namespace: flowloom-dev

resources:
  - namespace.yml
  - external-secret.yml
  - files-volume.yml
  - ../../base

configMapGenerator:
  - name: flowloom-environment
    literals:
      - FLOWLOOM_ENVIRONMENT=dev
      - PHX_HOST=dev-flowloom.miak-it.com
      - FLOWLOOM_FILES_DIR=/data/files

# The engine version this environment runs (a commit of 1a-khan/flowloom
# that CI built and scanned). Upgrade: change it and push.
images:
  - name: ghcr.io/1a-khan/flowloom
    newTag: 1b9a4f92fe504292c5a3b13c0394b188534829a7

replicas:
  - name: flowloom
    count: 1

patches:
  - target:
      kind: Ingress
      name: flowloom
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev-flowloom.miak-it.com
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: flowloom-dev-forwarded-https@kubernetescrd
  # Form uploads on a volume (files-volume.yml), so they outlive a restart.
  - target:
      kind: Deployment
      name: flowloom
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: files
            persistentVolumeClaim:
              claimName: flowloom-files
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: files
            mountPath: /data/files
