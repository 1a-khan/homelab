apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-agent-api-internal
  namespace: calendar-agent
  annotations:
    secret.reloader.stakater.com/reload: "graph-calendar-agent"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-agent-api
      exposure: internal
  template:
    metadata:
      labels:
        app: calendar-agent-api
        exposure: internal
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: localhost/calendar-agent-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: graph-calendar-agent
          env:
            - name: CALENDAR_USER_ID
              value: support@miak-it.de
            - name: REQUIRE_API_KEY
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-agent-api-external
  namespace: calendar-agent
  annotations:
    secret.reloader.stakater.com/reload: "graph-calendar-agent,calendar-agent-api-key"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-agent-api
      exposure: external
  template:
    metadata:
      labels:
        app: calendar-agent-api
        exposure: external
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: localhost/calendar-agent-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: graph-calendar-agent
            - secretRef:
                name: calendar-agent-api-key
          env:
            - name: CALENDAR_USER_ID
              value: support@miak-it.de
            - name: REQUIRE_API_KEY
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-agent-api
  namespace: calendar-agent
spec:
  type: ClusterIP
  selector:
    app: calendar-agent-api
    exposure: internal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-agent-api-external
  namespace: calendar-agent
spec:
  type: ClusterIP
  selector:
    app: calendar-agent-api
    exposure: external
  ports:
    - name: http
      port: 80
      targetPort: http
