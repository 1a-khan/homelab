apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:2.30.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
              name: http
            - containerPort: 5679
              name: runner-broker
          env:
            - name: SERVICE_URL_N8N
              value: https://n8n.miak-it.com
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.miak-it.com
            - name: WEBHOOK_URL
              value: https://n8n.miak-it.com
            - name: N8N_WEBHOOK_URL
              value: https://n8n.miak-it.com
            - name: N8N_HOST
              value: n8n.miak-it.com
            - name: N8N_PROTOCOL
              value: https
            - name: GENERIC_TIMEZONE
              value: UTC
            - name: TZ
              value: UTC
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_HOST
              value: postgres.database.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: SERVICE_USER_POSTGRES
            - name: DB_POSTGRESDB_SCHEMA
              value: public
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: SERVICE_PASSWORD_POSTGRES
            - name: EXECUTIONS_MODE
              value: queue
            - name: QUEUE_BULL_REDIS_HOST
              value: valkey.valkey.svc.cluster.local
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: VALKEY_PASSWORD
            - name: QUEUE_HEALTH_CHECK_ACTIVE
              value: "true"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: external
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: N8N_RUNNERS_BROKER_PORT
              value: "5679"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            - name: N8N_RUNNERS_MAX_CONCURRENCY
              value: "5"
            - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
              value: "true"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "true"
            - name: N8N_GIT_NODE_DISABLE_BARE_REPOS
              value: "true"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_SKIP_AUTH_ON_OAUTH_CALLBACK
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_SKIP_AUTH_ON_OAUTH_CALLBACK
            - name: N8N_SECURE_COOKIE
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-worker
  namespace: n8n
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: worker
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n-worker
          image: n8nio/n8n:2.30.8
          imagePullPolicy: IfNotPresent
          command:
            - n8n
          args:
            - worker
          env:
            - name: GENERIC_TIMEZONE
              value: UTC
            - name: TZ
              value: UTC
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_HOST
              value: postgres.database.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: SERVICE_USER_POSTGRES
            - name: DB_POSTGRESDB_SCHEMA
              value: public
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: SERVICE_PASSWORD_POSTGRES
            - name: EXECUTIONS_MODE
              value: queue
            - name: QUEUE_BULL_REDIS_HOST
              value: valkey.valkey.svc.cluster.local
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: VALKEY_PASSWORD
            - name: QUEUE_HEALTH_CHECK_ACTIVE
              value: "true"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: external
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: N8N_RUNNERS_BROKER_PORT
              value: "5679"
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            - name: N8N_RUNNERS_MAX_CONCURRENCY
              value: "5"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "true"
            - name: N8N_GIT_NODE_DISABLE_BARE_REPOS
              value: "true"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_PROXY_HOPS
              value: "1"
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-task-runners
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: task-runners
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: task-runners
    spec:
      enableServiceLinks: false
      containers:
        - name: task-runners
          image: n8nio/runners:2.30.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5680
              name: http
          env:
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: http://n8n-worker:5679
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_RUNNERS_AUTH_TOKEN
            - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
              value: "15"
            - name: N8N_RUNNERS_MAX_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 5678
      targetPort: http
    - name: runner-broker
      port: 5679
      targetPort: runner-broker
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-worker
  namespace: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: worker
  ports:
    - name: runner-broker
      port: 5679
      targetPort: 5679
